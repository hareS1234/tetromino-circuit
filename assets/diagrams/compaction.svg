<title id="t">compaction example with non-adjacent full rows, keep bits and inclusive ranks</title>
<style>text{font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;fill:#222}.m{fill:#666;font-size:11px}.s{font-size:10px}.b{font-weight:bold}.mono{font-family:ui-monospace,Menlo,monospace}</style>
