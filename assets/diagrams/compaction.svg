<text x="20" y="275" class="m">Output rows 0..16 keep the survivors’ order (rows 1, 3, 5, 6, 7 → 0, 1, 2, 3, 4); the top 3 rows are zero.</text>
<text x="20" y="291" class="m">Selection: match[d][s] = keep[s] ∧ rank[s] = d+1 (one-hot per output row). Reference model/compaction.py; proof formal/compactor (unbounded k-induction).</text>
