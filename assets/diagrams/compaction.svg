<text x="20" y="26" class="b">Stable compaction by inclusive prefix ranks (line_clear_parallel / line_clear_pipe P4–P12)</text>
<text x="20" y="44" class="m">Example: rows 0, 2 and 4 are full (non-adjacent). keep[s] = row s is not full; rank[s] = kept rows at or below s (inclusive prefix);</text>
<text x="20" y="58" class="m">a kept row s lands in output row rank[s]−1, so survivors keep their order and the top rows are zero-filled.</text>
<text x="20" y="78" class="b s">row s</text>
<text x="90" y="78" class="b s">content</text>
<text x="330" y="78" class="b s">keep</text>
<text x="400" y="78" class="b s">rank</text>
<text x="470" y="78" class="b s">→ output row</text>
