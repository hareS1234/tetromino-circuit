<text x="466.0" y="109.0" text-anchor="middle" class="m">compactor</text>
<text x="466.0" y="145" text-anchor="middle" class="mono s">A0 24 cyc</text>
<text x="466.0" y="160" text-anchor="middle" class="mono s">A1 24 cyc</text>
<rect x="410" y="170" width="9.703971119133573" height="8" fill="#666"/>
<rect x="410" y="181" width="67.2" height="8" fill="#d95f02"/>
<line x1="522" y1="97" x2="540" y2="97" stroke="#222" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="540" y="70" width="112" height="54" rx="4" fill="#f2f2f2" stroke="#999"/>
