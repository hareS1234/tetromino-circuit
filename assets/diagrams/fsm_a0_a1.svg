<text x="206.0" y="145" text-anchor="middle" class="mono s">A0 26 cyc</text>
<text x="206.0" y="160" text-anchor="middle" class="mono s">A1 4 cyc</text>
<rect x="150" y="170" width="10.512635379061372" height="8" fill="#666"/>
<rect x="150" y="181" width="11.2" height="8" fill="#d95f02"/>
<line x1="262" y1="97" x2="280" y2="97" stroke="#222" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="280" y="70" width="112" height="54" rx="4" fill="#f2f2f2" stroke="#999"/>
<text x="336.0" y="95.0" text-anchor="middle" class="b ">MERGE</text>
<text x="336.0" y="109.0" text-anchor="middle" class="m">lock cells</text>
<text x="336.0" y="145" text-anchor="middle" class="mono s">A0 8 cyc</text>
<text x="336.0" y="160" text-anchor="middle" class="mono s">A1 3 cyc</text>
<rect x="280" y="170" width="3.234657039711191" height="8" fill="#666"/>
