<text x="596.0" y="160" text-anchor="middle" class="mono s">A1 4 cyc</text>
<rect x="540" y="170" width="86.52707581227436" height="8" fill="#666"/>
<rect x="540" y="181" width="11.2" height="8" fill="#d95f02"/>
<line x1="652" y1="97" x2="670" y2="97" stroke="#222" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="670" y="70" width="112" height="54" rx="4" fill="#f2f2f2" stroke="#999"/>
<text x="726.0" y="95.0" text-anchor="middle" class="b ">SCORE</text>
<text x="726.0" y="109.0" text-anchor="middle" class="m">76L−51A−36Q−18U</text>
<text x="726.0" y="145" text-anchor="middle" class="mono s">A0 3 cyc</text>
<text x="726.0" y="160" text-anchor="middle" class="mono s">A1 3 cyc</text>
<rect x="670" y="170" width="2" height="8" fill="#666"/>
<rect x="670" y="181" width="8.4" height="8" fill="#d95f02"/>
