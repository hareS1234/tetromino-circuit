<rect x="800" y="70" width="112" height="54" rx="4" fill="#f2f2f2" stroke="#999"/>
<text x="856.0" y="95.0" text-anchor="middle" class="b ">FINISH</text>
<text x="856.0" y="109.0" text-anchor="middle" class="m">local best</text>
<text x="856.0" y="145" text-anchor="middle" class="mono s">A0 1 cyc</text>
<text x="856.0" y="160" text-anchor="middle" class="mono s">A1 1 cyc</text>
<rect x="800" y="170" width="2" height="8" fill="#666"/>
<rect x="800" y="181" width="2.8" height="8" fill="#d95f02"/>
<text x="20" y="210" class="m">Bars: each state’s share of the candidate’s cycles (grey A0, orange A1; a full-width bar would be 100 % of that architecture’s total).</text>
<text x="20" y="226" class="m">A0 spends 213 of 277 cycles scanning features cell by cell and 25 dropping; A1 keeps the 23-cycle compactor as 58 % of its 40.</text>
<text x="20" y="242" class="m">A2 removes the FSM: every state becomes one or more pipeline banks and a new candidate enters every cycle (docs/design_a2.md).</text>
</svg>
