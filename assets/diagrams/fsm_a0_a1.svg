<svg xmlns="http://www.w3.org/2000/svg" width="940" height="258" viewBox="0 0 940 258" role="img" aria-labelledby="t">
<title id="t">A0/A1 candidate evaluator FSM with measured state residency</title>
<style>text{font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;fill:#222}.m{fill:#666;font-size:11px}.s{font-size:10px}.b{font-weight:bold}.mono{font-family:ui-monospace,Menlo,monospace}</style>
<rect width="940" height="258" fill="white"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<text x="20" y="26" class="b">Candidate evaluator FSM (candidate_eval, shared by A0 and A1): measured cycles per legal candidate without a line clear</text>
<text x="20" y="44" class="m">Residency from results/stage_cycles_a0_repr0_p0.json (A0 bitmap) and results/stage_cycles_a1_repr1_p0.json (A1 cache), profile legal_no_clear: totals 277 and 40 cycles.</text>
