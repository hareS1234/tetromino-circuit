<text x="76.0" y="109.0" text-anchor="middle" class="m">shape ROM</text>
<text x="76.0" y="145" text-anchor="middle" class="mono s">A0 1 cyc</text>
<text x="76.0" y="160" text-anchor="middle" class="mono s">A1 1 cyc</text>
<rect x="20" y="170" width="2" height="8" fill="#666"/>
<rect x="20" y="181" width="2.8" height="8" fill="#d95f02"/>
