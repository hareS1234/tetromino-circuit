<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250" role="img" aria-labelledby="t">
<title id="t">A2 grouped pipeline with the immutable context and per-token payload</title>
<style>text{font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;fill:#222}.m{fill:#666;font-size:11px}.s{font-size:10px}.b{font-weight:bold}.mono{font-family:ui-monospace,Menlo,monospace}</style>
<rect width="980" height="250" fill="white"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
