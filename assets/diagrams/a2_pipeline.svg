<text x="95" y="158" text-anchor="middle" class="m s">owned by the core</text><text x="95" y="171" text-anchor="middle" class="m s">for the whole search</text>
<rect x="200" y="60" width="60" height="120" rx="4" fill="#f2f2f2" stroke="#999"/>
