# The measurement identities include tool version strings, so release validation belongs on the same
# linux-x64 toolchain that produced the published routes. Run this only after the Mac and remote-CI records
# are committed. Full history is needed because the v1 validator checks release tags.
name: release-check
"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
      - run: make doctor
      - run: make check-release-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-check
          path: |
            build/release_v2_check.json
            results/evidence/U20/**
          if-no-files-found: ignore
